[project]
name = "benchmark-mac"
version = "0.3.1"
description = "Suite de benchmarks locaux et reproductibles pour macOS, Windows et Linux"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "psutil==7.1.0",
  "pydantic>=2.10,<3",
  "typer>=0.15,<1",
  "wgpu==0.32.0",
]

[project.scripts]
benchmark-mac = "benchmark_mac.cli:app"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
  "ruff>=0.9,<1",
]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build]
exclude = ["/comparaison.html"]

[tool.hatch.build.targets.wheel]
packages = ["src/benchmark_mac"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py314"
